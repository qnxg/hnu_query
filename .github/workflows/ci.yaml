name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-
      - name: Check compilation
        run: cargo check --all-targets --all-features
      - name: Check Cargo.lock
        run: cargo fetch --locked
      - name: Check doc
        run: RUSTDOCFLAGS='-Dwarnings' cargo doc --all-features --no-deps --document-private-items
      - name: Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Check Code Format
        run: cargo fmt --check

  test:
    name: Test (${{ matrix.os }})
    needs: check
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-
      - name: Run tests
        run: cargo test

  report:
    name: Report
    if: github.event_name == 'pull_request'
    needs: check
    runs-on: ubuntu-latest
    environment: report
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install nightly (for rustdoc JSON)
        run: rustup toolchain install nightly --profile minimal

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-report-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-report-
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov and cargo-public-api
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-public-api

      - name: Prepare report directory
        run: mkdir -p target/ci-report

      - name: Generate coverage (lcov)
        run: python3 scripts/coverage.py --lcov --output-path target/ci-report/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: target/ci-report/lcov.info
          fail_ci_if_error: true

      - name: Generate public API diff
        run: |
          python3 scripts/public_api_diff.py \
            --simplified \
            --output target/ci-report/api-diff.txt \
            "${{ github.event.pull_request.base.sha }}..${{ github.sha }}"

      - name: Build PR markdown report
        env:
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 scripts/pr_report.py \
            --lcov target/ci-report/lcov.info \
            --api-diff target/ci-report/api-diff.txt \
            --base "${{ github.event.pull_request.base.sha }}" \
            --codecov-url "https://app.codecov.io/gh/${REPO}/pull/${PR_NUMBER}" \
            --output target/ci-report/pr-report.md

      - name: Find existing report comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- hnu-query-ci-report -->"

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-path: target/ci-report/pr-report.md
          edit-mode: replace
