name: Publish Report

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Download pr-report artifact
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.payload.workflow_run.id,
            });
            const artifact = artifacts.data.artifacts.find(a => a.name === 'pr-report');
            if (!artifact) {
              core.setFailed('pr-report artifact not found in upstream CI run');
              return;
            }
            const zip = await github.rest.actions.downloadArtifact({
              owner: context.repo.owner,
              repo: context.repo.repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });
            fs.writeFileSync('pr-report.zip', Buffer.from(zip.data));

      - name: Unzip artifact
        run: unzip pr-report.zip -d report

      - name: Resolve PR number
        id: pr
        if: github.event.workflow_run.event == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const headSha = context.payload.workflow_run.head_sha;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let prNumber = null;

            try {
              const result = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: headSha,
              });
              if (result.data.length > 0) prNumber = result.data[0].number;
            } catch (e) {
              core.warning(`listPullRequestsAssociatedWithCommit failed: ${e.message}`);
            }

            if (!prNumber) {
              for (let page = 1; page <= 5; page++) {
                const prs = await github.rest.pulls.list({
                  owner, repo, state: 'open', per_page: 100, page,
                });
                if (prs.data.length === 0) break;
                const match = prs.data.find(p => p.head.sha === headSha);
                if (match) { prNumber = match.number; break; }
              }
            }

            if (!prNumber) {
              core.warning(`No open PR associated with commit ${headSha}`);
              return;
            }
            core.setOutput('number', prNumber);

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: report/lcov.info
          fail_ci_if_error: true
          override_commit: ${{ github.event.workflow_run.head_sha }}
          override_pr: ${{ steps.pr.outputs.number }}

      - name: Find existing report comment
        if: github.event.workflow_run.event == 'pull_request' && steps.pr.outputs.number
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-author: github-actions[bot]
          body-includes: "<!-- hnu-query-ci-report -->"

      - name: Create or update PR comment
        if: github.event.workflow_run.event == 'pull_request' && steps.pr.outputs.number
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ steps.pr.outputs.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-path: report/pr-report.md
          edit-mode: replace
