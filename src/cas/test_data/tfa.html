	<style>
		div,
		form,
		img,
		ul,
		ol,
		li,
		dl,
		dt,
		dd,
		table,
		td,
		tr,
		th,
		p,
		span {
			font-size: 14px;
		}

		ul>li {
			list-style: none;
		}

		input,
		button {
			outline: none;
			border: none;
		}

		body {
			background: #ffffff url("assets/images/login_bgnew.jpg") no-repeat center center;
			background-size: 100% 100%;
			min-height: 100vh;
			position: relative;
		}

		/*头部*/
		.header {
			background: none;
		}

		.header .logo {
			padding: 18px 0;
			margin-left: 83px;
		}

		.header .logo img {
			height: 55px;
			display: inline-block;
			vertical-align: middle;
		}

		.header .logo span {
			color: #ffffff;
			display: inline-block;
			vertical-align: middle;
			margin-left: 24px;
			font-size: 28px;
		}

		/*内容*/
		.zfcontent {
			position: absolute;
			top: 50%;
			left: 50%;
			transform: translate(-50%, -50%);
			background: #F0F1F2;
			border-radius: 10px;
			padding: 30px;
			box-shadow: 0 3px 6px rgba(0, 0, 0, 0.16);

		}

		.form-box {
			padding: 30px;
			background: #FFFFFF;
			border-radius: 9px;
			width: 420px;
		}

		.form-header {
			padding-top: 10px;
			text-align: center;
			position: relative;
		}

		.form-header img {
			height: 18px;
			display: inline-block;
			vertical-align: middle;
		}

		.form-header img:nth-last-child(2) {
			cursor: pointer;
		}

		.form-header span {
			display: inline-block;
			vertical-align: middle;
			color: #57A0F4;
			font-size: 22px;
			line-height: 22px;
		}

		.form-header-tips {
			color: #7C7C7C;
			position: absolute;
			background: #ffffff;
			padding: 15px;
			border-radius: 10px;
			text-align: left;
			top: 50%;
			right: -64px;
			transform: translate(100%, -50%);
			box-shadow: 0 3px 16px rgba(0, 0, 0, 0.16);
			display: none;
		}

		.form-header-tips:before {
			content: "";
			display: block;
			position: absolute;
			top: 50%;
			left: -18px;
			transform: translateY(-50%);
			border-right: 13px solid #ffffff;
			border-top: 10px solid transparent;
			border-left: 5px solid transparent;
			border-bottom: 10px solid transparent;
		}

		.form-tab {
			margin-top: 34px;
			border-bottom: 1px solid #C9C9C9;
			padding: 0 20px 12px;
		}

		.form-tab ul {
			display: flex;
			align-items: center;
			justify-content: space-between;
		}

		.form-tab ul li {
			color: #7C7C7C;
			position: relative;
			padding: 0 5px;
			line-height: 20px;
			cursor: pointer;
		}

		.form-tab ul li.active:after {
			content: "";
			display: block;
			position: absolute;
			bottom: -12px;
			left: 0;
			width: 100%;
			height: 2px;
			background: #57A0F4;
		}

		.form-content form {
			display: none;
		}

		.form-content .un-bind p {
			color: red;
			text-align: center;
			padding: 40px 0;
		}

		.form-content .un-bind a {
			display: block;
			background: #57A0F4;
			width: 100%;
			color: #ffffff;
			line-height: 45px;
			height: 45px;
			border-radius: 4px;
			text-align: center;
		}

		.form-content .un-bind a:hover {
			text-decoration: none;
		}

		.form-content .form-input {
			display: flex;
			align-items: center;
			margin: 20px 0;
		}

		.form-content .form-input span {
			color: #ABB3B9;
		}

		.form-content .form-input input {
			flex-grow: 1;
			border-radius: 4px;
			border: 1px solid #E0E0E0;
			line-height: 45px;
			padding: 0 12px;
			margin-left: 8px;
		}

		.form-content .form-input input:focus {
			border: 1px solid #57A0F4;
		}

		.form-content .form-input-all input {
			width: 100%;
			margin-left: 0;
		}

		.form-input.form-input-send input {
			margin-left: 0;
		}

		.form-input-send button {
			padding: 0 8px;
			margin-left: 15px;
			height: 45px;
			border-radius: 4px;
			background: #57A0F4;
			color: #ffffff;
			cursor: pointer;
		}

		.form-button {
			margin: 60px 0 30px;
			position: relative;
		}

		.error-tips {
			position: absolute;
			top: -50%;
			transform: translateY(-50%);
			color: red;
		}

		.form-button button {
			background: #57A0F4;
			width: 100%;
			color: #ffffff;
			line-height: 45px;
			height: 45px;
			border-radius: 4px;
			cursor: pointer;
		}

		.footer {
			position: absolute;
			width: 100%;
			bottom: 44px;
			color: #ffffff;
			text-align: center;
			padding: 0 5px
		}

		.dis-button {
			cursor: not-allowed !important;
			opacity: 0.9;
		}

		::-webkit-input-placeholder {
			/* WebKit, Blink, Edge */
			color: #ABB3B9 !important;
		}

		:-moz-placeholder {
			/* Mozilla Firefox 4 to 18 */
			color: #ABB3B9 !important;
		}

		::-moz-placeholder {
			/* Mozilla Firefox 19+ */
			color: #ABB3B9 !important;
		}

		:-ms-input-placeholder {
			/* Internet Explorer 10-11 */
			color: #ABB3B9 !important;
		}

		@media (max-width: 768px) {
			.header .logo {
				margin: 0;
				text-align: center;
			}

			.header .logo span {
				display: none;
			}

			.zfcontent {
				width: 90%;
				padding: 15px;
			}

			.zfcontent .form-box {
				width: auto;
				padding: 15px;
			}

			.form-tab {
				padding: 0 0 12px;
			}

			.form-tab ul li {
				padding: 0;
			}

			.form-header-tips {
				display: none;
				top: 0;
				transform: translate(-50%, -100%);
				right: auto;
				left: 50%;
			}

			.form-header-tips:before {
				bottom: -18px;
				left: auto;
				top: auto;
				right: 20%;
				transform: translateY(0);
				border-right: 7px solid transparent;
				border-top: 9px solid #fff;
				border-left: 7px solid transparent;
				border-bottom: 9px solid transparent;
			}
		}

		@media (max-width: 400px) {
			.form-content .form-input input {
				width: 75%;
			}

			.form-input-send button {
				width: 24%;
				margin-left: 5px;
			}
		}

		@media (max-width: 320px) {
			.zfcontent {
				width: 95%;
				padding: 10px;
			}

			.zfcontent .form-box {
				width: auto;
				padding: 10px;
			}

			.form-button {
				margin: 40px 0 20px;
				position: relative;
			}
		}

		#qcodepc .qrcode-bg {
			width: 190px;
			height: 190px;
			position: absolute;
			top: 36%;
			left: 50%;
			margin-left: -95px;
			background-color: #000;
			opacity: 0.65;
		}

		#qcodepc>p {
			font-size: 22px;
			line-height: 22px;
			color: #7C7C7C;
			text-align: center;
		}

		#qcodepc>span {
			color: #7C7C7C;
			font-size: 14px;
			width: 100%;
			text-align: center;
			display: block;
			line-height: 20px;
			margin-top: 23px;
		}

		#qcodepc .refresh-text {
			position: absolute;
			line-height: 250px;
			top: 28%;
			left: 46%;
			z-index: 9;
		}

		#qcodepc .refresh-text .fa {
			font-size: 20px;
			color: #fff;
			vertical-align: middle;
		}

		#qcodepc .refresh-text a {
			color: #fff;
			vertical-align: middle;
			font-size: 16px;
		}
	</style>
</head>
